# UNICC Threat Intelligence — section path → category map
#
# Matching: case-insensitive substring match against the joined section_path.
#   e.g. pattern "ransomware" matches "4. RANSOMWARE", "4.1 LOCKBIT", "· Ransomware".
# Multi-category: a chunk may match multiple categories; all matches are recorded.
# Exclude fallback: if a chunk matches ONLY patterns in `exclude:` (no category
#   pattern matched), it gets categories=[]. If both exclude AND a category
#   match, the category wins.
#
# Reviewed: 2026-06-19, 7 reports.
# Corpus: ENISA 2023/2024/2025-booklet, MS DDFR 2023-execsummary/2024/2025, ATT_CSRIC_v6.
# Updated: 2026-06-19 — added patterns to cover uncategorized sections found in Phase 2 run.

